name: Verify SQL Quiz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify quiz against live database
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: "5432"
          PGDATABASE: postgres
          QUIZ_PGUSER: ${{ secrets.QUIZ_PGUSER }}
          QUIZ_PGPASSWORD: ${{ secrets.QUIZ_PGPASSWORD }}
        run: python verify_quiz.py